[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "becgpp"
version = "1.0.0"
description = "A GPU-accelerated spectral ground-state solver for trapped, rotating and self-gravitating Bose-Einstein condensates in 2D, 3D and quasi-2D."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Duy", email = "lebaoduy0503@gmail.com" },
]
keywords = [
    "Bose-Einstein condensate", "Gross-Pitaevskii", "Gross-Pitaevskii-Poisson",
    "vortex lattice", "self-gravity", "Thomas-Fermi", "GPU", "quantum droplet",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "torch>=1.12",
    "numpy>=1.21",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
yaml = ["PyYAML>=5.4"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Duyle0503/becGPP"
Repository = "https://github.com/Duyle0503/becGPP"

[project.scripts]
becgpp = "becgpp.cli:main"

[tool.setuptools]
packages = ["becgpp"]

[tool.setuptools.package-data]
becgpp = ["py.typed"]
