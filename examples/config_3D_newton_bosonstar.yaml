# Non-rotating, harmonically trapped self-gravitating condensate in 3D (Newton 1/r).
# Converges on the residual criterion (stop_reason=converged); check virial_rel and
# points_per_R90 (>= 12) in the output. Set s: 0 for the untrapped star.
mode: single
dimension: "3D"
s: 2
Omega: 0.0
beta2: 100
beta3: 0
G_C: 20
kernel: newton
L: 8
Ngrid: 128
seed: tf
zip_output: false
